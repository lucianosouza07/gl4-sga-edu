<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SGA-Edu | Cadastrar professor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="pagina">
      <header class="cabecalho">
        <div>
          <h1>Cadastrar professor</h1>
          <p>Preencha os dados para incluir um novo professor no sistema.</p>
        </div>
        <a class="voltar" href="../tela_inicial/index.html">Voltar ao início</a>
      </header>

      <div class="conteudo">
        <section class="painel">
          <h2 id="titulo-form">Novo professor</h2>
          <form id="form-professor" novalidate>
            <div class="campo">
              <label for="nome">Nome completo</label>
              <input id="nome" name="nome" type="text" autocomplete="off" />
              <small class="erro" data-erro="nome"></small>
            </div>

            <div class="linha">
              <div class="campo">
                <label for="email">E-mail institucional</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="off"
                />
                <small class="erro" data-erro="email"></small>
              </div>
              <div class="campo">
                <label for="cpf">CPF</label>
                <input
                  id="cpf"
                  name="cpf"
                  type="text"
                  inputmode="numeric"
                  maxlength="14"
                  placeholder="000.000.000-00"
                />
                <small class="erro" data-erro="cpf"></small>
              </div>
            </div>

            <div class="linha">
              <div class="campo">
                <label for="telefone">Telefone (opcional)</label>
                <input
                  id="telefone"
                  name="telefone"
                  type="text"
                  inputmode="tel"
                  maxlength="15"
                  placeholder="(00) 00000-0000"
                />
                <small class="erro" data-erro="telefone"></small>
              </div>
              <div class="campo">
                <label for="titulacao">Titulação</label>
                <select id="titulacao" name="titulacao">
                  <option value="">Selecione</option>
                  <option>Graduação</option>
                  <option>Especialização</option>
                  <option>Mestrado</option>
                  <option>Doutorado</option>
                </select>
                <small class="erro" data-erro="titulacao"></small>
              </div>
            </div>

            <div class="campo">
              <label for="departamento">Departamento</label>
              <input
                id="departamento"
                name="departamento"
                type="text"
                autocomplete="off"
              />
              <small class="erro" data-erro="departamento"></small>
            </div>

            <p class="mensagem" id="mensagem" role="status"></p>

            <div class="acoes">
              <button type="submit" class="btn btn-primario" id="btn-salvar">
                Cadastrar professor
              </button>
              <button
                type="button"
                class="btn btn-secundario"
                id="btn-cancelar"
                hidden
              >
                Cancelar edição
              </button>
            </div>
          </form>
        </section>

        <section class="painel">
          <h2>Professores cadastrados</h2>
          <div class="tabela-wrap">
            <table>
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Departamento</th>
                  <th>Titulação</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tabela-professores"></tbody>
            </table>
          </div>
          <p class="vazio" id="vazio" hidden>
            Nenhum professor cadastrado ainda.
          </p>
        </section>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
